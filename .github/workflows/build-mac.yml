name: Build macOS App

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install PyQt5 Pillow pyinstaller

      - name: Build macOS .app
        run: |
          pyinstaller ValorantBirthdayPets.spec

      - name: Package as .dmg
        run: |
          hdiutil create -volname "BirthdayPets" -srcfolder dist/ValorantBirthdayPets.app -ov -format UDZO dist/BirthdayPets.dmg

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: BirthdayPets-macOS
          path: dist/ValorantBirthdayPets.app

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: BirthdayPets-macOS-dmg
          path: dist/BirthdayPets.dmg
